<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TPSODL Enforcement & Squad Operations Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a1b38 0%, #1e3a8a 50%, #0f2b5c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card login-card mx-auto bg-white p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="fa-solid fa-bolt-lightning fs-2 text-warning"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">TPSODL Enforcement</h4>
                <p class="text-muted small">Squad Operations & Performance Portal</p>
            </div>

            <div id="loginAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/dashboard" class="btn btn-outline-secondary btn-sm w-100">
                    <i class="fa-solid fa-chart-pie me-1"></i> Back to Public Dashboard
                </a>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <small class="text-muted">
                    TP SOUTHERN ODISHA DISTRIBUTION LIMITED<br>
                    Enforcement & Vigilance Operations MIS
                </small>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('loginAlert');
            if (urlParams.get('msg') === 'auth_required' && alertBox) {
                alertBox.className = 'alert alert-info py-2 small';
                alertBox.innerHTML = '<i class="fa-solid fa-lock me-1"></i> Please sign in with your credentials to access operational desks.';
                alertBox.style.display = 'block';
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            setButtonLoading('btnLogin', true);
            const alertBox = document.getElementById('loginAlert');
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Authentication failed");

                // Save user metadata in localStorage
                localStorage.setItem('tpsodl_user', JSON.stringify({
                    username: data.username,
                    role: data.role,
                    circle: data.circle,
                    can_edit: data.can_edit
                }));

                // Redirect to target operational desk or dashboard
                const urlParams = new URLSearchParams(window.location.search);
                const nextTarget = urlParams.get('next') || sessionStorage.getItem('redirect_after_login') || '/dashboard';
                sessionStorage.removeItem('redirect_after_login');
                window.location.href = nextTarget;
            } catch(err) {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.innerText = err.message;
                alertBox.style.display = 'block';
            } finally {
                setButtonLoading('btnLogin', false, '<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal');
            }
        }
    </script>
</body>
</html>
